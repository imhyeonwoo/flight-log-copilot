name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.13"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python sources
        env:
          PYTHONPATH: src
        run: |
          python -m compileall src app.py
          python -c "import flightlog_copilot"

      - name: Verify README assets
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path("docs/images/flight-analysis-dashboard.png"),
              Path("docs/images/parameter-mapping.png"),
              Path("docs/images/hypothesis-diagnosis.png"),
          ]
          missing = [str(path) for path in paths if not path.is_file()]
          assert not missing, f"Missing README images: {missing}"
          PY

      - name: Run test suite
        run: python -m pytest

      - name: Check repository cleanliness
        run: git diff --exit-code
